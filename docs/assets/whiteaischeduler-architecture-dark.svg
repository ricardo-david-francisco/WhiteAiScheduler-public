<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 642" width="960" height="642" font-family="'Brand Mono', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" role="img" aria-label="WhiteAiScheduler: a request event in the source calendar is picked up by a 15-minute trigger, planned by Gemini on Vertex AI as JSON, validated, and written as events in the destination calendar with a run ID.">
