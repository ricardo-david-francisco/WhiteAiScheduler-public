<text x="832.0" y="387" font-size="14" font-weight="700" text-anchor="middle" fill="#EDF1F2">Reasoning</text>
<text x="832.0" y="405" font-size="11.5" text-anchor="middle" fill="#8B969C">in the request</text>
<rect x="35" y="446" width="435" height="176" rx="10" fill="#12171A" stroke="#2C363C"/>
<text x="55" y="476" font-size="12" font-weight="700" letter-spacing="1.5" fill="#CDF546">RELIABILITY</text>
<rect x="55" y="495" width="8" height="8" fill="#CDF546"/>
<text x="73" y="504" font-size="13" fill="#EDF1F2">script lock against overlapping runs</text>
<rect x="55" y="519" width="8" height="8" fill="#CDF546"/>
<text x="73" y="528" font-size="13" fill="#EDF1F2">stuck requests planned again after 15 min</text>
<rect x="55" y="543" width="8" height="8" fill="#CDF546"/>
<text x="73" y="552" font-size="13" fill="#EDF1F2">a whole plan undone by its run ID</text>
<rect x="55" y="567" width="8" height="8" fill="#CDF546"/>
<text x="73" y="576" font-size="13" fill="#EDF1F2">events without times skipped, not guessed</text>
<rect x="55" y="591" width="8" height="8" fill="#CDF546"/>
<text x="73" y="600" font-size="13" fill="#EDF1F2">levelled logs for every step</text>
<rect x="490" y="446" width="435" height="176" rx="10" fill="#12171A" stroke="#2C363C"/>
<text x="510" y="476" font-size="12" font-weight="700" letter-spacing="1.5" fill="#CDF546">PRIVACY</text>
<rect x="510" y="495" width="8" height="8" fill="#CDF546"/>
<text x="528" y="504" font-size="13" fill="#EDF1F2">runs inside the owner's Google account</text>
<rect x="510" y="519" width="8" height="8" fill="#CDF546"/>
<text x="528" y="528" font-size="13" fill="#EDF1F2">no server between calendar and model</text>
<rect x="510" y="543" width="8" height="8" fill="#CDF546"/>
<text x="528" y="552" font-size="13" fill="#EDF1F2">no stored API key: the script's OAuth token</text>
<rect x="510" y="567" width="8" height="8" fill="#CDF546"/>
<text x="528" y="576" font-size="13" fill="#EDF1F2">calendar IDs kept in script properties</text>
<rect x="510" y="591" width="8" height="8" fill="#CDF546"/>
<text x="528" y="600" font-size="13" fill="#EDF1F2">logs stay in the owner's Cloud project</text>
</svg>