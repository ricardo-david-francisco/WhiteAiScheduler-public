<rect x="400.0" y="366" width="160.0" height="50" rx="8" fill="#12171A" stroke="#2C363C"/>
<text x="480.0" y="387" font-size="14" font-weight="700" text-anchor="middle" fill="#EDF1F2">Done</text>
<text x="480.0" y="405" font-size="11.5" text-anchor="middle" fill="#8B969C">[PROCESSADO], green</text>
