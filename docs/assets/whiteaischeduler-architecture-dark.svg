<text x="595.0" y="236" font-size="12.5" text-anchor="middle" fill="#8B969C">reasoning</text>
<text x="595.0" y="255" font-size="12.5" text-anchor="middle" fill="#8B969C">and events</text>
<line x1="699.0" y1="222.0" x2="721.0" y2="222.0" stroke="#818C92" stroke-width="1.6" marker-end="url(#ah)"/>
