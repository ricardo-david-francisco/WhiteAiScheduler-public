<text x="656.0" y="73" font-size="14" font-weight="700" text-anchor="middle" fill="#EDF1F2">Order</text>
<text x="656.0" y="91" font-size="11.5" text-anchor="middle" fill="#8B969C">redo, stuck, new</text>
